# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: azanmart
    runtime: node
    plan: free
    # Dev dependencies are needed to compile the Tailwind stylesheet
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CRYPTO_RECEIVER_ADDRESS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
