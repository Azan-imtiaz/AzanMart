name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # mongodb-memory-server downloads a MongoDB binary on first use
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov-report

  docker:
    name: Build and smoke-test the Docker image
    runs-on: ubuntu-latest
    needs: test
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t azanmart .

      - name: Start the container
        run: |
          docker run -d --name azanmart --network host \
            -e MONGODB_URL=mongodb://localhost:27017/azanmart \
            -e SESSION_SECRET=ci-only-secret \
            azanmart

      - name: Wait for /health and load the home page
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/health; then break; fi
            sleep 2
          done
          curl -fs http://localhost:3000/health
          curl -fs http://localhost:3000/ | grep -q "AzanMart"

      - name: Show container logs on failure
        if: failure()
        run: docker logs azanmart
