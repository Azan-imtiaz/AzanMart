# Runs AzanMart with its own MongoDB: docker compose up --build
# Then load demo data with: docker compose exec app npm run seed -- --force
# ${...} values come from your shell or from the .env file next to this one
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URL: mongodb://mongo:27017/azanmart
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      APP_URL: ${APP_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CRYPTO_RECEIVER_ADDRESS: ${CRYPTO_RECEIVER_ADDRESS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
